# Per-client supersampling for the gaming Sunshine instance.
# Installed to ~/.config/gaming-setup/clients.conf (not overwritten on reinstall).
#
# Sunshine's global_prep_cmd hands the launcher only the requested
# width / height / fps - NOT the paired device name - so a client is identified
# here by the resolution it asks for. Pick a `match` that only your target
# device sends (its native panel resolution, or the one you always choose on it).
#
# When a client matches and factor > 1, the headless session is rendered at
#     <requested> x factor          (clamped to the profile's max_width/height)
# and Sunshine downscales to <requested> for transport. Result: a cleaner, less
# shimmery picture at the SAME stream resolution and the SAME client decode cost.
# The extra work is GPU render time on this machine (~factor^2 pixels), so leave
# it at 1 for heavy titles with no headroom.
#
#   match   - comma-separated globs, tested against "WxH" and "WxH@FPS"
#             e.g.  1280x720, 1280x800, 1920x1080@60, 1280x*
#   factor  - 1 = off (default). 1.5 turns a 720p pick into a 1080p session,
#             2.0 into 1440p.
#   enabled - false keeps the entry but ignores it.
#
# Edit here, from the status page (http://localhost:47992), or:
#   gaming-launcher clients set "Steam Deck" 1.5 1280x720
#   gaming-launcher clients list
#   gaming-launcher clients off "Steam Deck"

[Steam Deck]
match   = 1280x720, 1280x800
factor  = 1
enabled = true

[AYN Thor Artemis]
match   = 1920x1080
factor  = 1
enabled = true
