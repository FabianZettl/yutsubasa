# Quality profiles for gaming-launcher.
# Installed to ~/.config/gaming-setup/profiles.conf (not overwritten on reinstall).
#
# Keys:
#   max_width / max_height / max_fps  - ceiling for the headless output; the
#                                       client's request is clamped to these.
#   codec        - preferred: av1 | hevc | h264  (client may negotiate lower)
#   bitrate      - advisory kbps ceiling (Moonlight/Artemis negotiates the rest)
#   gamescope    - extra args inserted into the in-session gamescope wrapper
#   audio_isolation / input_isolation - whether to route audio to the null sink
#                                       and pull controller endpoints off the desktop
#
# RX 7800 XT = single VCN 4.0 unit: AV1 + HEVC + H.264 encode, no dual-VCN
# load-balancing. One hardware stream at a time.

[gaming-high-perf]
description     = High-performance gaming, 1440p120
max_width       = 2560
max_height      = 1440
max_fps         = 120
codec           = av1
bitrate         = 50000
gamescope       = -F fsr --hdr-enabled
audio_isolation = true
input_isolation = true

[balanced]
description     = Co-op / general use, 1080p60
max_width       = 1920
max_height      = 1080
max_fps         = 60
codec           = hevc
bitrate         = 25000
gamescope       = -F fsr
audio_isolation = true
input_isolation = true

[remote-work]
description     = Low bitrate remote use, 1080p30
max_width       = 1920
max_height      = 1080
max_fps         = 30
codec           = h264
bitrate         = 10000
gamescope       =
audio_isolation = false
input_isolation = false

[custom]
description     = User-defined - edit freely
max_width       = 2560
max_height      = 1440
max_fps         = 120
codec           = hevc
bitrate         = 30000
gamescope       =
audio_isolation = true
input_isolation = true
