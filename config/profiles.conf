# Quality profile for gaming-launcher.
# Installed to ~/.config/gaming-setup/profiles.conf (not overwritten on reinstall).
#
# There is deliberately ONE tuned profile (`gaming`) plus a scratch `custom`.
# The old high-perf / balanced / remote-work ladder is gone: switching profiles
# mid-session re-writes sunshine.conf and can hitch the stream, and the only
# knobs that ever really differed were the codec and the two isolation flags.
#
# Keys:
#   max_width / max_height / max_fps  - safety ceiling for the headless output.
#                                       The client's own request is used as-is
#                                       below this (no forced downscale).
#   render_scale - stream at this fraction of the client's resolution and let
#                  the client upscale (0.50-0.99; 1 = off). 0.75 turns a 1080p
#                  request into an ~1440x808 stream: shorter encode + decode, and
#                  the negotiated bitrate covers fewer pixels (cleaner on lossy
#                  Wi-Fi). FPS is untouched. Toggle live: `gaming-launcher scale`.
#   codec        - av1 | hevc | h264 . Sets which codecs Sunshine *advertises*;
#                  the client negotiates. `hevc` = advertise HEVC + H.264,
#                  `h264` = H.264 only, `av1` = AV1 + HEVC + H.264.
#   bitrate      - advisory only; the real number is a Moonlight/Artemis client
#                  setting. Wired LAN: ~30-40 Mbps @1440p, ~20-25 @1080p.
#   gamescope    - extra args for the in-session gamescope wrapper (off by default)
#   audio_isolation / input_isolation - route audio to the null sink, forward
#                                       client input into the session
#
# RX 7800 XT = ONE VCN 4.0 unit. Default advertises **HEVC + H.264** (not AV1):
# H.264 stays available for anything that wants the shortest decode, and
# Android / Qualcomm-decoder handhelds (Artemis on a Snapdragon) run measurably
# smoother on HEVC. moonlight-qt on the Steam Deck negotiates whichever it
# prefers. Use the `custom` profile (H.264-only) if a client regresses on HEVC.

[gaming]
description     = Low-latency gaming - client-native resolution, HEVC + H.264
max_width       = 2560
max_height      = 1440
max_fps         = 144
render_scale    = 1
codec           = hevc
bitrate         = 40000
gamescope       =
audio_isolation = true
input_isolation = true

[custom]
description     = H.264-only fallback / scratch - edit freely
max_width       = 2560
max_height      = 1440
max_fps         = 144
render_scale    = 1
codec           = h264
bitrate         = 40000
gamescope       =
audio_isolation = true
input_isolation = true
