# gaming-launcher top-level configuration.
# Installed to ~/.config/gaming-setup/gaming-setup.conf (not overwritten on reinstall).

[general]
# Profile used when none is given on the command line. One tuned profile
# (`gaming`); `custom` is a scratch profile. See profiles.conf.
default_profile = gaming

# Fallback headless resolution/fps before a client connects (a client's own
# request overrides this, clamped to the profile ceiling).
width  = 2560
height = 1440
fps    = 120

# Global default for wrapping games in gamescope. Usually leave this false and
# opt in per game: `add-game "<name>" steam:<id> --gamescope`, or pass
# `--gamescope` / `--no-gamescope` to `run`. gamescope gives heavy Vulkan /
# DX12-via-Proton titles a real WSI swapchain (fixes the headless-wlroots black
# screen), an FPS cap at the client's rate, FSR upscaling and lower-latency
# present. Verified working nested on wlroots 0.20 + gles2.
use_gamescope = false

# gles2, not vulkan: wlroots' Vulkan renderer fails DMA-BUF import on a headless
# output on this Mesa (XR24 / modifier INVALID / bad FD) -> Sunshine "Frame
# capture failed". gles2 is rock-solid for headless screencopy.
wlr_renderer = gles2

# Absolute path to the sunshine binary (auto-detected if empty).
sunshine_bin =

# Keyboard layout the input bridge (sunshine-input-bridge) uploads to the gaming
# session's virtual keyboard. Empty = copy it from the running desktop Hyprland
# (input:kb_layout), falling back to "us".
kb_layout =

# Absolute path to sunshine-input-bridge (auto-detected: PATH, then build/,
# src/, ~/.local/bin, /usr/local/bin).
input_bridge_bin =

[audio]
# Name of the persistent PipeWire null sink that game audio is routed to.
sink_name = sink-sunshine

[secondscreen]
# Second Sunshine runs on port 48020. Client-driven: width/height/fps below are
# just the initial size before the first client connects.
width    = 1920
height   = 1080
fps      = 60
position = left       # left | right | up | down | <X>x<Y>   (of your desktop)
scale    = 1
workspace = 99      # dedicated Hyprland workspace for GL-SCREEN (so it doesn't grab 1)

# Mode is chosen in Moonlight/Artemis by picking an app:
#   "Zweitmonitor"          - headless extra monitor
#   "Hauptmonitor spiegeln" - your primary monitor as-is
#   "Remote Work"           - headless screen + primary monitor OFF
mirror_output =              # which monitor is "primary" (empty = auto focused/first)

# audio for the whole second-screen instance:
#   off         - no audio at all (default). Avoids default-sink hijack, mic leaks
#                 and Sunshine's sink-sunshine-stereo/-surround* clutter.
#   passthrough - desktop sound in mirror/remote (via a pw-loopback bridge).
# The *incoming* client mic is a Moonlight/Artemis setting, not a server one.
audio = off

[status]
# gl-status-serve: a small web page with live `status` / `troubleshoot` output
# and a Steam-library "add game" panel (yutsubasa-status.service).
port  = 47992
# loopback = only reachable on the host (http://localhost:47992).
# lan      = reachable from the LAN - then `token` is REQUIRED (embedded in the
#            page; any browser that can load the page can add games).
bind  = loopback
token =

[gamescope]
# Applied when a game is wrapped (see use_gamescope / --gamescope). gamescope
# always gets -W/-H/-r from the connecting client.
immediate_flips = true       # lower latency (allows tearing; the sway output allows it too)
rt              = true        # realtime scheduling (degrades gracefully if not permitted)
grab_cursor     = false       # --force-grab-cursor: helps relative-mouse FPS games
render_scale    = 1.0         # <1.0 -> render internally at scale x client res, FSR-upscale
extra           =             # any extra gamescope args (e.g. --hdr-enabled --mangoapp)

[adapter]
# Auto quality step-down daemon (opt-in; `gaming-launcher quality --auto on`).
enabled          = false
poll_seconds     = 5
downgrade_after  = 45
upgrade_after    = 15
